name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.0

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      linux_shards: ${{ steps.shards.outputs.linux_shards }}
      has_macos: ${{ steps.shards.outputs.has_macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - name: Check enrolled UI scoreboard checks
        run: bun run ui:scoreboard:check

      - name: Plan the run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_SUITE: ${{ contains(github.event.pull_request.labels.*.name, 'full-suite') }}
        run: bun scripts/test-baseline/cli.ts plan --event "$EVENT_NAME" --full "$FULL_SUITE" --out plan

      - name: Publish shard indices
        id: shards
        run: |
          echo "linux_shards=$(jq -c '[range(0; (.linuxShards | length))]' plan/plan.json)" >> "$GITHUB_OUTPUT"
          echo "has_macos=$(jq '(.macos | length) > 0' plan/plan.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: test-plan
          path: plan/
          retention-days: 1
          if-no-files-found: error

  linux:
    name: Linux shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.linux_shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.linux_shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Name the test tools cache
        id: tools
        run: echo "key=test-tools-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      # every shard fetching these from the Ubuntu mirror at once took up to a minute each
      - uses: actions/cache@v4
        with:
          path: ~/test-tools
          key: ${{ steps.tools.outputs.key }}

      - name: Install test tools
        run: |
          if ! compgen -G "$HOME/test-tools/*.deb" > /dev/null; then
            sudo apt-get clean
            sudo apt-get update
            sudo apt-get install -y --download-only zsh ripgrep
            mkdir -p "$HOME/test-tools"
            cp /var/cache/apt/archives/*.deb "$HOME/test-tools/"
          fi
          sudo dpkg -i "$HOME"/test-tools/*.deb
          # ubuntu's zshrc runs compinit, which stops at a prompt over the runner's writable function directories
          zsh -fc 'autoload -U compaudit; compaudit' | grep '^/' | xargs -r sudo chmod go-w

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: test-plan
          path: plan

      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
        run: bun scripts/test-baseline/cli.ts run-shard --plan plan --shard "$SHARD" --out "results/linux-$SHARD.json"

      - uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-${{ matrix.shard }}
          path: results/
          retention-days: 1
          if-no-files-found: error

  macos:
    name: macOS
    needs: plan
    if: needs.plan.outputs.has_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install test tools
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          # the runner's long hostname wraps zsh's default prompt, and the tests read that prompt back
          sudo scutil --set HostName ci && sudo hostname ci

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: test-plan
          path: plan

      - name: Run macOS files
        run: bun scripts/test-baseline/cli.ts run-shard --plan plan --macos --out results/macos.json

      - uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: results/
          retention-days: 1
          if-no-files-found: error

  speed:
    name: Speed
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      QUIRKY_SPEED_RUNNER: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun node_modules/playwright/cli.js install chromium

      - name: Isolate speed checks
        run: |
          echo "QUIRKY_HOME=$(mktemp -d)" >> "$GITHUB_ENV"
          echo "QUIRKY_SPEED_IMAGE_VERSION=${ImageVersion:?runner image version missing}" >> "$GITHUB_ENV"

      - name: Check real-daemon smoke
        run: bun test scripts/speed/run.e2e.test.ts

      - name: Prepare speed base
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA=$(git merge-base "$HEAD_SHA" origin/main)
            BASE_BASIS=merge-base
          else
            BASE_SHA=$(git rev-parse "$HEAD_SHA^")
            BASE_BASIS=parent
          fi
          git worktree add --detach "$RUNNER_TEMP/speed-base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/speed-base" && bun install --frozen-lockfile)
          {
            echo "SPEED_BASE_ROOT=$RUNNER_TEMP/speed-base"
            echo "SPEED_BASE_BASIS=$BASE_BASIS"
          } >> "$GITHUB_ENV"

      - name: Measure speed
        run: |
          measure_args=(--out speed --samples 20)
          if [ -n "${SPEED_BASE_ROOT:-}" ]; then
            measure_args+=(--base-root "$SPEED_BASE_ROOT" --base-basis "$SPEED_BASE_BASIS")
          fi
          bun scripts/speed.ts "${measure_args[@]}"

      - name: Compare speed
        if: always()
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/speed/ci.ts compare --current speed/report.json --pair speed/pair.json --out speed --head "$HEAD_SHA"

      - name: Qualify speed baseline
        id: qualify
        if: always()
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          bun -e 'import { validateReport } from "./scripts/speed/report.ts"; import { parseArtifactJson } from "./scripts/test-baseline/baseline.ts"; let r = null; try { r = validateReport(parseArtifactJson(await Bun.file("speed/report.json").text())) } catch {} console.log(`qualified=${r?.qualified === true && r.status === "complete" && r.cleanup === "complete" && r.commit === process.env.HEAD_SHA}`)' >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-run
          path: speed/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.qualify.outputs.qualified == 'true'
        with:
          name: speed-baseline-${{ github.sha }}
          path: speed/report.json
          retention-days: 14
          if-no-files-found: error

  tests:
    name: Tests
    needs: [plan, linux, macos, speed]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          pattern: test-plan
          path: plan
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: results
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          pattern: speed-run
          path: speed
          merge-multiple: true

      - name: Judge the run
        id: verdict
        if: always()
        continue-on-error: true
        env:
          JOBS_OK: ${{ needs.plan.result != 'failure' && needs.plan.result != 'cancelled' && needs.linux.result != 'failure' && needs.linux.result != 'cancelled' && needs.macos.result != 'failure' && needs.macos.result != 'cancelled' }}
          SPEED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p plan results out
          bun scripts/test-baseline/cli.ts verdict --plan plan --in results --out out --jobs-ok "$JOBS_OK" --speed speed

      - name: Ensure a comment exists
        if: always()
        run: |
          mkdir -p out
          if [ ! -f out/comment.md ]; then
            printf '<!-- test-baseline-verdict -->\n## Tests\n\nThe verdict was not produced, so this run counts as failed.\n\n### Speed\n\nnot measured: verdict renderer failed\n' > out/comment.md
          fi

      - name: Write the step summary
        if: always()
        run: cat out/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the pull request comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- test-baseline-verdict -->'
          {
            existing=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
            if [ -n "$existing" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@out/comment.md > /dev/null
            else
              gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@out/comment.md > /dev/null
            fi
          } || echo "::warning::could not post the verdict comment"

      - name: File issues
        if: github.event_name == 'push' && hashFiles('out/baseline.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/test-baseline/cli.ts issues --plan plan --baseline out/baseline.json --only open

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && hashFiles('out/baseline.json') != ''
        with:
          name: test-baseline-${{ github.sha }}
          path: out/baseline.json
          retention-days: 14
          if-no-files-found: error

      - name: Close resolved issues
        if: github.event_name == 'push' && hashFiles('out/baseline.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/test-baseline/cli.ts issues --plan plan --baseline out/baseline.json --only close

      - name: Fail when the verdict failed
        if: always() && steps.verdict.outcome == 'failure'
        run: exit 1
