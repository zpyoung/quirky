<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock review</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f4;
  --surface: #ffffff;
  --surface-2: #efefec;
  --border: #d6d6d0;
  --text: #1c1c1a;
  --muted: #62625c;
  --accent: #2f5fd0;
  --accent-text: #ffffff;
  --accent-soft: #e4ebfb;
  --warn: #8a5a00;
  --warn-soft: #fbf0d6;
  --danger: #b3261e;
  --ok: #1f7a3d;
  --change: #c2410c;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615;
    --surface: #1f1f1d;
    --surface-2: #2a2a27;
    --border: #3d3d38;
    --text: #ececE8;
    --muted: #a5a59d;
    --accent: #7ba0ff;
    --accent-text: #0d1424;
    --accent-soft: #232c45;
    --warn: #f0c36a;
    --warn-soft: #3a2f14;
    --danger: #ff8a80;
    --ok: #6fd08c;
    --change: #fb923c;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
}
button:hover:not(:disabled) { background: var(--surface-2); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
select { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
[hidden] { display: none !important; }

.app { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.banner {
  background: var(--warn-soft);
  color: var(--warn);
  border-bottom: 1px solid var(--border);
  padding: 6px 12px;
  font-weight: 600;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  padding: 8px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.chip {
  display: inline-block;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 12px;
  white-space: nowrap;
}
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); position: relative; }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.status { color: var(--muted); font-size: 13px; margin-left: auto; min-height: 1.4em; }
.status.error { color: var(--danger); }

.body { flex: 1; min-height: 0; display: grid; grid-template-columns: 272px minmax(0, 1fr); }
.rail {
  overflow: auto;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 10px 10px 16px;
}
.rail h2 { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 14px 4px 6px; }
.rail h2:first-child { margin-top: 2px; }
.rail ul { list-style: none; margin: 0; padding: 0; }
.screen-item { display: flex; align-items: center; gap: 4px; border-radius: 6px; }
.screen-item.current { background: var(--accent-soft); }
.screen-item > button.go {
  flex: 1;
  min-width: 0;
  text-align: left;
  border: 0;
  background: transparent;
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 6px 8px;
}
.screen-item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; flex: none; border-radius: 50%; border: 2px solid var(--muted); align-self: center; }
.dot.visited { background: var(--ok); border-color: var(--ok); }
.count { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.mark { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); padding-right: 6px; cursor: pointer; }
.note { color: var(--muted); font-size: 12px; margin: 2px 8px 4px; }
.skipped li { margin: 2px 8px; font-size: 12px; color: var(--muted); }
.pin-row { border: 1px solid var(--border); border-radius: 8px; margin: 0 2px 6px; background: var(--surface); }
.pin-row.selected { border-color: var(--accent); }
.pin-row > button.head { width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; display: block; }
.pin-row .meta { color: var(--muted); font-size: 12px; }
.badge { font-size: 11px; border-radius: 999px; padding: 0 7px; background: var(--surface-2); border: 1px solid var(--border); margin-left: 4px; white-space: nowrap; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.ok { color: var(--ok); }
.thread { padding: 0 8px 8px; }
.msg { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: var(--surface-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.agent { background: var(--accent-soft); }
.msg .who { display: block; font-size: 11px; color: var(--muted); }
.msg.last-reply { outline: 2px solid var(--ok); }

.stage { position: relative; min-width: 0; min-height: 0; overflow: auto; display: flex; justify-content: center; padding: 12px; background: var(--surface-2); }
.frame-box { position: relative; width: 100%; max-width: 100%; height: 100%; min-height: 360px; background: #fff; border-radius: 6px; box-shadow: 0 0 0 1px var(--border), 0 1px 4px rgba(0,0,0,0.12); }
.frame-box.mobile { width: 390px; }
.frame-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; border-radius: 6px; }
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 6px; }
.box { position: absolute; pointer-events: none; border-radius: 2px; }
.box.hover { outline: 2px solid var(--accent); outline-offset: 0; background: rgba(47, 95, 208, 0.08); }
.box.changed { outline: 2px dashed var(--change); outline-offset: 1px; }
.box .tag { position: absolute; left: 0; top: -20px; background: var(--accent); color: var(--accent-text); font-size: 11px; line-height: 16px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.box.changed .tag { background: var(--change); color: #fff; }
.pin {
  position: absolute;
  pointer-events: auto;
  width: 26px; height: 26px; padding: 0;
  transform: translate(-50%, -50%);
  border-radius: 50% 50% 50% 4px;
  background: var(--accent); color: var(--accent-text); border: 2px solid #fff;
  font-weight: 700; font-size: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.4);
}
.pin:hover:not(:disabled) { background: var(--accent); filter: brightness(1.12); }
.pin.resolved { background: var(--ok); color: #fff; }
.pin.selected { outline: 3px solid var(--text); }
.pop {
  position: absolute;
  pointer-events: auto;
  width: min(300px, calc(100% - 16px));
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
  padding: 10px;
  z-index: 5;
}
.pop h3 { margin: 0 0 6px; font-size: 13px; }
.pop textarea { width: 100%; min-height: 76px; resize: vertical; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px; }
.pop .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; align-items: center; }
.pop .err { color: var(--danger); font-size: 12px; margin-right: auto; }

.verdict { background: var(--surface); border-top: 1px solid var(--border); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.verdict .spacer { flex: 1; }
.verdict .panel { flex-basis: 100%; display: flex; flex-direction: column; gap: 6px; }
.verdict .panel textarea { width: 100%; min-height: 64px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px; }
.verdict .panel .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.verdict .err { color: var(--danger); }
.verdict .info { color: var(--muted); }

@media (max-width: 760px) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .rail { max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--border); }
  .stage { padding: 6px; }
  .frame-box.mobile { width: 390px; max-width: 100%; }
  .status { margin-left: 0; flex-basis: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="banner" hidden></div>
  <header class="bar" id="toolbar">
    <span class="chip" id="version-chip"></span>
    <label id="version-wrap" hidden>Version <select id="version-picker" aria-label="Mock version"></select></label>
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" id="mode-interact" aria-pressed="true">Interact</button>
      <button type="button" id="mode-comment" aria-pressed="false">Comment</button>

      <button type="button" id="vp-desktop" aria-pressed="true">Desktop</button>
      <button type="button" id="vp-mobile" aria-pressed="false">Mobile 390px</button>

    <label class="toggle"><input type="checkbox" id="show-changes"> Show changes</label>

  <div class="body">

      <div class="frame-box" id="frame-box">

        <div class="overlay" id="overlay">
          <div id="layer-changes"></div>
          <div id="layer-hover"></div>
          <div id="layer-pins"></div>
          <div id="layer-pop"></div>
        </div>
      </div>
    </main>
  </div>
  <footer class="verdict" id="verdict" hidden></footer>
</div>

:.02em}\n  .math-i{font:italic 13.5px \"Times New Roman\",serif}\n  sup.fn a{font-size:9.5px;border:0;padding:0 1px}\n  .footnotes{border-top:1px solid var(--border);margin-top:12px;padding-top:6px;font-size:11px;color:var(--muted)}\n  .footnotes ol{margin:0;padding-left:18px}\n  details.disc{border:1px solid var(--border);border-radius:7px;margin:0 0 10px;padding:0 10px}\n  details.disc summary{cursor:pointer;padding:5px 0;font-weight:600;color:var(--text)}\n  details.disc summary::marker{color:var(--accent)}\n  details.disc[open]{padding-bottom:6px}\n  kbd{font:10.5px ui-monospace,Menlo,monospace;background:var(--surface);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px}\n  mark{background:color-mix(in srgb,var(--amber) 28%,transparent);color:inherit;padding:0 2px;border-radius:3px}\n  .json{font:11.5px/1.6 ui-monospace,Menlo,monospace;padding:6px 10px}\n  .json details{margin-left:14px}.json>details{margin-left:0}\n  .json summary{cursor:pointer;list-style:none}\n  .json summary::before{content:\"▸ \";color:var(--muted)}\n  .json details[open]>summary::before{content:\"▾ \"}\n  .json .kk{color:var(--syn-fn)}\n  .json .row{margin-left:14px}\n  .img{border:1px solid var(--border);border-radius:7px;overflow:hidden;margin:0 0 4px;max-width:360px}\n  .cap{font-size:10.5px;color:var(--muted);margin-bottom:10px}\n  .caret{color:var(--accent);animation:blink 1s steps(1) infinite}\n  @keyframes blink{50%{opacity:0}}\n  .rerr{border:1px dashed color-mix(in srgb,var(--red) 55%,transparent);border-radius:7px;margin:0 0 10px;overflow:hidden}\n  .rerr .msg{font-size:11px;color:var(--red);padding:4px 10px;background:color-mix(in srgb,var(--red) 8%,transparent)}\n  .rerr pre{margin:0;padding:6px 10px;font:11.5px ui-monospace,Menlo,monospace;white-space:pre}\n  .pill{position:sticky;bottom:12px;display:block;margin:10px auto 0;width:fit-content;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:5px 12px;font:600 11px system-ui;box-shadow:0 4px 14px #0007;cursor:pointer}\n  .scrollbox{height:420px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface);position:relative}\n  .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}\n  .note-strip{font-size:10.5px;color:var(--muted);margin:0 0 10px;padding:4px 8px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}\n  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--sel);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:7px;font-size:11px;display:none;z-index:9}\n  .dlg-back{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:8}\n  .dlg{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:14px;width:300px}\n  .dlg h3{margin:0 0 6px;font-size:13px}\n  .dlg .url{font:11px ui-monospace,Menlo,monospace;color:var(--muted);word-break:break-all;margin-bottom:12px}\n  .dlg .btns{display:flex;gap:6px;justify-content:flex-end}\n  .dlg button{border:1px solid var(--border);background:var(--sel);color:var(--text);border-radius:7px;padding:4px 10px;font:11px system-ui;cursor:pointer}\n  .dlg button.primary{background:var(--accent);border-color:var(--accent);color:#fff}\n  .viewcard{border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden}\n  .viewcard .vh{padding:6px 12px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}\n  .viewcard .vb{padding:12px}\n  .editor{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}\n  .editor .src{background:var(--codebg);padding:10px;font:11.5px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--muted);border-right:1px solid var(--border)}\n  .editor .out{background:var(--surface);padding:12px}\n  @media (max-width:600px){.editor{grid-template-columns:1fr}.editor .src{border-right:0;border-bottom:1px solid var(--border)}.turn-user{max-width:90%}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"qk\" id=\"root\">\n\u003cnav class=\"top\">\n  \u003ca href=\"#/transcript\" data-nav=\"transcript\">Chat transcript\u003c/a>\n  \u003ca href=\"#/view-card\" data-nav=\"view-card\">Agent-drawn view\u003c/a>\n  \u003ca href=\"#/editor-preview\" data-nav=\"editor-preview\">Editor preview\u003c/a>\n\u003c/nav>\n\n\u003c!-- ============ Chat transcript ============ -->\n\u003csection data-screen=\"transcript\">\n \u003cdiv data-state=\"default\">\u003cdiv class=\"win\" id=\"showcase\">\n  \u003cdiv class=\"turn-user\" data-pin=\"user-bubble\">Why does reloading a session drop the half-finished reply? Fix it and show me what changed.\u003c/div>\n  \u003cdiv class=\"who\">Claude Code · opus\u003c/div>\n  \u003cdiv class=\"prose\">\n   \u003ch1 data-pin=\"h1\">Session reload drops partial replies\u003c/h1>\n   \u003cp data-pin=\"para-chips\">The reload path in \u003cspan class=\"chip\" data-pin=\"path-chip\" data-file>&#128196; chat/turns.ts:119\u003c/span> replaces partial prose items instead of merging them, so \u003ccode class=\"inl\" data-pin=\"inline-code\">mergeProse()\u003c/code> never sees the tail. See the \u003ca data-pin=\"link\" data-href=\"https://github.com/zpyoung/quirky/pull/637\">original chat PR\u003c/a> for how partial items were meant to work.\u003csup class=\"fn\">\u003ca href=\"#fn1\">1\u003c/a>\u003c/sup>\u003c/p>\n   \u003cdiv class=\"alert a-warn\" data-pin=\"alert-warning\">\u003cb>&#9888; Warning\u003c/b>Sessions saved before this fix still have the truncated reply on disk. Reloading won't recover them.\u003c/div>\n   \u003cdiv class=\"alert a-tip\" data-pin=\"alert-tip\">\u003cb>&#10022; Tip\u003c/b>Press \u003ckbd>&#8984;\u003c/kbd> \u003ckbd>R\u003c/kbd> in the transcript to reload and check the fix yourself.\u003c/div>\n\n   \u003ch2 data-pin=\"h2\">What changed\u003c/h2>\n   \u003cul class=\"tasks\" data-pin=\"task-list\">\n    \u003cli class=\"done\">\u003cspan class=\"cb on\">&#10003;\u003c/span>\u003cspan class=\"t\">Merge partial items on reload\u003c/span>\u003c/li>\n    \u003cli class=\"done\">\u003cspan class=\"cb on\">&#10003;\u003c/span>\u003cspan class=\"t\">Add a regression test for mid-stream reloads\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"cb\">\u003c/span>\u003cspan class=\"t\">Backfill sessions saved before the fix\u003c/span>\u003c/li>\n   \u003c/ul>\n\n   \u003cdiv class=\"code nums\" data-pin=\"code-block\">\n    \u003cdiv class=\"hd\">\u003cspan data-pin=\"code-header\">turns.ts\u003c/span>\u003cbutton data-copy data-pin=\"copy-btn\">&#10697; Copy\u003c/button>\u003c/div>\n    \u003cpre>\u003cspan class=\"l\">\u003cspan class=\"k\">export function\u003c/span> \u003cspan class=\"f\">mergeProse\u003c/span>(prev: \u003cspan class=\"ty\">ProseItem\u003c/span>[], next: \u003cspan class=\"ty\">ProseItem\u003c/span>) {\u003c/span>\u003cspan class=\"l\">  \u003cspan class=\"k\">const\u003c/span> last = prev.\u003cspan class=\"f\">at\u003c/span>(\u003cspan class=\"n\">-1\u003c/span>)\u003c/span>\u003cspan class=\"l\">  \u003cspan class=\"c\">// a partial item is replaced only by its own completion\u003c/span>\u003c/span>\u003cspan class=\"l\">  \u003cspan class=\"k\">if\u003c/span> (last?.partial &amp;&amp; last.id === next.id) {\u003c/span>\u003cspan class=\"l\">    \u003cspan class=\"k\">return\u003c/span> [...prev.\u003cspan class=\"f\">slice\u003c/span>(\u003cspan class=\"n\">0\u003c/span>, \u003cspan class=\"n\">-1\u003c/span>), next]\u003c/span>\u003cspan class=\"l\">  }\u003c/span>\u003cspan class=\"l\">  \u003cspan class=\"k\">if\u003c/span> (last?.partial) \u003cspan class=\"k\">return\u003c/span> [...prev, next]\u003c/span>\u003cspan class=\"l\">  \u003cspan class=\"k\">return\u003c/span> [...prev, { ...next, partial: \u003cspan class=\"k\">false\u003c/span> }]\u003c/span>\u003cspan class=\"l\">}\u003c/span>\u003cspan class=\"l\">\u003cspan class=\"k\">export const\u003c/span> RELOAD_GRACE_MS = \u003cspan class=\"n\">250\u003c/span>\u003c/span>\u003c/pre>\n   \u003c/div>\n\n   \u003cdiv class=\"code\" data-pin=\"diff-block\">\n    \u003cdiv class=\"hd\">\u003cspan>diff\u003c/span>\u003cbutton data-copy>&#10697; Copy\u003c/button>\u003c/div>\n    \u003cpre>\u003cspan class=\"l\">  const items = loadTurns(session)\u003c/span>\u003cspan class=\"l del\">- return items.filter(i =&gt; !i.partial)\u003c/span>\u003cspan class=\"l add\">+ return items.reduce(mergeProse, [])\u003c/span>\u003c/pre>\n   \u003c/div>\n\n   \u003cdiv class=\"code nums collapsible closed\" data-pin=\"long-code\">\n    \u003cdiv class=\"hd\">\u003cspan>reload.test.ts\u003c/span>\u003cbutton data-copy>&#10697; Copy\u003c/button>\u003c/div>\n    \u003cpre>\u003cspan class=\"l\">\u003cspan class=\"k\">import\u003c/span> { describe, expect, test } \u003cspan class=\"k\">from\u003c/span> \u003cspan class=\"s\">'bun:test'\u003c/span>\u003c/span>\u003cspan class=\"l\">\u003cspan class=\"k\">import\u003c/span> { mergeProse } \u003cspan class=\"k\">from\u003c/span> \u003cspan class=\"s\">'../src/window/chat/turns'\u003c/span>\u003c/span>\u003cspan class=\"l\">\u003c/span>\u003cspan class=\"l\">\u003cspan class=\"f\">describe\u003c/span>(\u003cspan class=\"s\">'reload mid-stream'\u003c/span>, () =&gt; {\u003c/span>\u003cspan class=\"l\">  \u003cspan class=\"f\">test\u003c/span>(\u003cspan class=\"s\">'keeps the partial tail'\u003c/span>, () =&gt; {\u003c/span>\u003cspan class=\"l\">    \u003cspan class=\"k\">const\u003c/span> prev = [{ id: \u003cspan class=\"s\">'p1'\u003c/span>, text: \u003cspan class=\"s\">'The bug is'\u003c/span>, partial: \u003cspan class=\"k\">true\u003c/span> }]\u003c/span>\u003cspan class=\"l\">    \u003cspan class=\"k\">const\u003c/span> out = \u003cspan class=\"f\">mergeProse\u003c/span>(prev, { id: \u003cspan class=\"s\">'p1'\u003c/span>, text: \u003cspan class=\"s\">'The bug is in turns.ts'\u003c/span> })\u003c/span>\u003cspan class=\"l\">    \u003cspan class=\"f\">expect\u003c/span>(out).\u003cspan class=\"f\">toHaveLength\u003c/span>(\u003cspan class=\"n\">1\u003c/span>)\u003c/span>\u003cspan class=\"l\">  })\u003c/span>\u003cspan class=\"l\">  \u003cspan class=\"f\">test\u003c/span>(\u003cspan class=\"s\">'appends a new item after a partial one'\u003c/span>, () =&gt; {\u003c/span>\u003cspan class=\"l\">    \u003cspan class=\"c\">// ...\u003c/span>\u003c/span>\u003cspan class=\"l\">  })\u003c/span>\u003cspan class=\"l\">  \u003cspan class=\"f\">test\u003c/span>(\u003cspan class=\"s\">'marks completed items final'\u003c/span>, () =&gt; {\u003c/span>\u003cspan class=\"l\">    \u003cspan class=\"c\">// ...\u003c/span>\u003c/span>\u003cspan class=\"l\">  })\u003c/span>\u003cspan class=\"l\">  \u003cspan class=\"f\">test\u003c/span>(\u003cspan class=\"s\">'survives a reload during a tool call'\u003c/span>, () =&gt; {\u003c/span>\u003cspan class=\"l\">    \u003cspan class=\"c\">// ...\u003c/span>\u003c/span>\u003cspan class=\"l\">  })\u003c/span>\u003cspan class=\"l\">  \u003cspan class=\"f\">test\u003c/span>(\u003cspan class=\"s\">'drops nothing when the session is idle'\u003c/span>, () =&gt; {\u003c/span>\u003cspan class=\"l\">    \u003cspan class=\"c\">// ...\u003c/span>\u003c/span>\u003cspan class=\"l\">  })\u003c/span>\u003cspan class=\"l\">})\u003c/span>\u003c/pre>\n    \u003cdiv class=\"fade\">\u003c/div>\n    \u003cbutton class=\"showall\" data-showall data-pin=\"show-all\">Show all 23 lines\u003c/button>\n   \u003c/div>\n\n   \u003ch3 data-pin=\"h3\">Test results\u003c/h3>\n   \u003cdiv class=\"tbl\" data-pin=\"table\">\u003ctable>\n    \u003ctr>\u003cth>Test\u003c/th>\u003cth>Result\u003c/th>\u003cth>Time\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>keeps the partial tail\u003c/td>\u003ctd class=\"pass\">&#10003; pass\u003c/td>\u003ctd>4 ms\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>appends a new item after a partial one\u003c/td>\u003ctd class=\"pass\">&#10003; pass\u003c/td>\u003ctd>2 ms\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>survives a reload during a tool call\u003c/td>\u003ctd class=\"pass\">&#10003; pass\u003c/td>\u003ctd>31 ms\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>drops nothing when the session is idle\u003c/td>\u003ctd class=\"fail\">&#10007; fail\u003c/td>\u003ctd>6 ms\u003c/td>\u003c/tr>\n   \u003c/table>\u003c/div>\n\n   \u003ch2>How a reload flows now\u003c/h2>\n   \u003cdiv class=\"fig\" data-pin=\"mermaid\">\n    \u003cdiv class=\"hd\">\u003cspan>mermaid\u003c/span>\u003cspan>\u003cbutton data-src data-pin=\"mermaid-source\">Source\u003c/button> \u003cbutton data-copy>Copy\u003c/button>\u003c/span>\u003c/div>\n    \u003cdiv class=\"body\">\u003csvg width=\"440\" height=\"70\" viewBox=\"0 0 440 70\" font-family=\"system-ui\" font-size=\"11\">\n     \u003cg fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.2\">\u003crect x=\"4\" y=\"20\" width=\"90\" height=\"30\" rx=\"6\" fill=\"color-mix(in srgb,var(--accent) 12%,transparent)\"/>\u003crect x=\"128\" y=\"20\" width=\"90\" height=\"30\" rx=\"6\" fill=\"color-mix(in srgb,var(--teal) 12%,transparent)\" stroke=\"var(--teal)\"/>\u003crect x=\"252\" y=\"20\" width=\"90\" height=\"30\" rx=\"6\" fill=\"color-mix(in srgb,var(--violet) 12%,transparent)\" stroke=\"var(--violet)\"/>\u003crect x=\"376\" y=\"20\" width=\"60\" height=\"30\" rx=\"6\" fill=\"color-mix(in srgb,var(--green) 12%,transparent)\" stroke=\"var(--green)\"/>\n     \u003cpath d=\"M94 35h30M218 35h30M342 35h30\" stroke=\"var(--muted)\" marker-end=\"url(#ar)\"/>\u003c/g>\n     \u003cdefs>\u003cmarker id=\"ar\" viewBox=\"0 0 6 6\" refX=\"5\" refY=\"3\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\u003cpath d=\"M0 0L6 3L0 6z\" fill=\"var(--muted)\"/>\u003c/marker>\u003c/defs>\n     \u003cg fill=\"var(--text)\" text-anchor=\"middle\">\u003ctext x=\"49\" y=\"39\">loadTurns\u003c/text>\u003ctext x=\"173\" y=\"39\">mergeProse\u003c/text>\u003ctext x=\"297\" y=\"39\">Prose blocks\u003c/text>\u003ctext x=\"406\" y=\"39\">render\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\n    \u003cpre class=\"src\">flowchart LR\n  A[loadTurns] --&gt; B[mergeProse]\n  B --&gt; C[Prose blocks]\n  C --&gt; D[render]\u003c/pre>\n   \u003c/div>\n\n   \u003cp data-pin=\"math-inline\">Merging is a single fold, so reload cost is \u003cspan class=\"math-i\">O(n)\u003c/span> in the number of items, and a $5 or $10 price in prose stays text.\u003c/p>\n   \u003cdiv class=\"math-b\" data-pin=\"math-block\">T\u003csub>reload\u003c/sub> = &Sigma;\u003csub>i=1\u003c/sub>\u003csup>n\u003c/sup> c\u003csub>merge\u003c/sub>(item\u003csub>i\u003c/sub>) &asymp; n &middot; 0.4 &micro;s\u003c/div>\n\n   \u003cdetails class=\"disc\" data-pin=\"details\">\u003csummary>Why not keep partial items out of the saved file?\u003c/summary>\n    \u003cp style=\"margin:4px 0 0\">Saving them is what lets a crash mid-reply recover the text. Dropping them would trade one data-loss bug for another. \u003cmark>The merge keeps both.\u003c/mark>\u003c/p>\u003c/details>\n\n   \u003ch4>Session sizes\u003c/h4>\n   \u003cdiv class=\"tbl\" data-pin=\"csv-fence\">\u003ctable>\n    \u003ctr>\u003cth>session\u003c/th>\u003cth>items\u003c/th>\u003cth>partial\u003c/th>\u003cth>reload_ms\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>brain-chat\u003c/td>\u003ctd>1,284\u003c/td>\u003ctd>3\u003c/td>\u003ctd>11\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>avatar-pr\u003c/td>\u003ctd>402\u003c/td>\u003ctd>1\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>qa-loop\u003c/td>\u003ctd>6,910\u003c/td>\u003ctd>12\u003c/td>\u003ctd>58\u003c/td>\u003c/tr>\n   \u003c/table>\u003c/div>\n\n   \u003cdiv class=\"code\" data-pin=\"json-fence\">\n    \u003cdiv class=\"hd\">\u003cspan>json\u003c/span>\u003cbutton data-copy>&#10697; Copy\u003c/button>\u003c/div>\n    \u003cdiv class=\"json\">\u003cdetails open>\u003csummary>{ 3 keys }\u003c/summary>\n     \u003cdiv class=\"row\">\u003cspan class=\"kk\">\"id\"\u003c/span>: \u003cspan class=\"s\">\"p1\"\u003c/span>,\u003c/div>\n     \u003cdiv class=\"row\">\u003cspan class=\"kk\">\"partial\"\u003c/span>: \u003cspan class=\"k\">true\u003c/span>,\u003c/div>\n     \u003cdetails>\u003csummary>\u003cspan class=\"kk\">\"chunks\"\u003c/span>: [ 4 items ]\u003c/summary>\u003cdiv class=\"row\">\u003cspan class=\"s\">\"The bug\"\u003c/span>, \u003cspan class=\"s\">\" is in\"\u003c/span>, \u003cspan class=\"s\">\" turns\"\u003c/span>, \u003cspan class=\"s\">\".ts\"\u003c/span>\u003c/div>\u003c/details>\n    \u003c/details>\u003c/div>\n   \u003c/div>\n\n   \u003cdiv class=\"fig\" data-pin=\"chart-fence\">\n    \u003cdiv class=\"hd\">\u003cspan>chart · reload time by session\u003c/span>\u003cspan>\u003cbutton data-src>Source\u003c/button>\u003c/span>\u003c/div>\n    \u003cdiv class=\"body\">\u003csvg width=\"380\" height=\"110\" viewBox=\"0 0 380 110\" font-family=\"system-ui\" font-size=\"10.5\">\n     \u003cg fill=\"var(--muted)\">\u003ctext x=\"0\" y=\"24\">brain-chat\u003c/text>\u003ctext x=\"0\" y=\"54\">avatar-pr\u003c/text>\u003ctext x=\"0\" y=\"84\">qa-loop\u003c/text>\u003c/g>\n     \u003crect x=\"70\" y=\"14\" width=\"56\" height=\"14\" rx=\"3\" fill=\"var(--accent)\"/>\u003crect x=\"70\" y=\"44\" width=\"20\" height=\"14\" rx=\"3\" fill=\"var(--teal)\"/>\u003crect x=\"70\" y=\"74\" width=\"290\" height=\"14\" rx=\"3\" fill=\"var(--violet)\"/>\n     \u003cg fill=\"var(--text)\">\u003ctext x=\"132\" y=\"25\">11 ms\u003c/text>\u003ctext x=\"96\" y=\"55\">4 ms\u003c/text>\u003ctext x=\"300\" y=\"85\" fill=\"#fff\">58 ms\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\n    \u003cpre class=\"src\">{\"type\":\"bar\",\"x\":\"session\",\"y\":\"reload_ms\",\"data\":\"session-sizes\"}\u003c/pre>\n   \u003c/div>\n\n   \u003cp>Screenshot from the reload check, and the upstream \u003cspan class=\"chip remote\" data-pin=\"remote-image\">&#128279; image: status.example.com/badge.png\u003c/span>:\u003c/p>\n   \u003cdiv class=\"img\" data-pin=\"local-image\">\u003csvg width=\"360\" height=\"120\" viewBox=\"0 0 360 120\">\u003crect width=\"360\" height=\"120\" fill=\"var(--rail)\"/>\u003crect x=\"12\" y=\"12\" width=\"336\" height=\"18\" rx=\"4\" fill=\"var(--sel)\"/>\u003crect x=\"12\" y=\"40\" width=\"220\" height=\"10\" rx=\"3\" fill=\"var(--border)\"/>\u003crect x=\"12\" y=\"58\" width=\"280\" height=\"10\" rx=\"3\" fill=\"var(--border)\"/>\u003crect x=\"12\" y=\"76\" width=\"160\" height=\"10\" rx=\"3\" fill=\"var(--border)\"/>\u003ctext x=\"20\" y=\"25\" font-size=\"10\" fill=\"var(--muted)\" font-family=\"system-ui\">reload-check.png\u003c/text>\u003c/svg>\u003c/div>\n   \u003cdiv class=\"cap\">.quirk/screenshots/reload-check.png\u003c/div>\n\n   \u003cp>H\u003csub>2\u003c/sub>O-style sub and x\u003csup>2\u003c/sup> superscript work too, and :rocket: becomes &#128640;.\u003c/p>\n\n   \u003cdiv class=\"footnotes\" data-pin=\"footnotes\">\u003col>\u003cli id=\"fn1\">Partial items were added so a crash mid-reply keeps its text. &#8617;\u003c/li>\u003c/ol>\u003c/div>\n  \u003c/div>\n \u003c/div>\u003c/div>\n\n \u003cdiv data-state=\"streaming\">\u003cdiv class=\"win\">\n  \u003cdiv class=\"turn-user\">Why does reloading a session drop the half-finished reply?\u003c/div>\n  \u003cdiv class=\"who\">Claude Code · opus · writing&#8230;\u003c/div>\n  \u003cdiv class=\"prose\">\n   \u003ch1>Session reload drops partial replies\u003c/h1>\n   \u003cp data-pin=\"repaired-bold\">The reload path replaces partial prose items, which is \u003cstrong>the root cau\u003c/strong>\u003c/p>\n   \u003cdiv class=\"note-strip\">Above: the reply so far ends inside \u003ccode class=\"inl\">**the root cau\u003c/code>. It already shows bold, with no stray asterisks.\u003c/div>\n   \u003cdiv class=\"code\" data-pin=\"open-fence\">\n    \u003cdiv class=\"hd\">\u003cspan>turns.ts\u003c/span>\u003cbutton data-copy>&#10697; Copy\u003c/button>\u003c/div>\n    \u003cpre>\u003cspan class=\"l\">export function mergeProse(prev: ProseItem[], next: ProseItem) {\u003c/span>\u003cspan class=\"l\">  const last = prev.at(-1)\u003c/span>\u003cspan class=\"l\">  if (last?.partial &amp;&amp; last.id === next.id) {\u003cspan class=\"caret\" data-pin=\"caret\">&#9613;\u003c/span>\u003c/span>\u003c/pre>\n   \u003c/div>\n   \u003cdiv class=\"note-strip\">An open fence already has its header and stays plain; colour fades in when the closing fence arrives. Line numbers appear once it passes 8 lines.\u003c/div>\n  \u003c/div>\n \u003c/div>\u003c/div>\n\n \u003cdiv data-state=\"scrolled-up\">\u003cdiv class=\"win\">\n  \u003cdiv class=\"note-strip\">You scrolled up to reread while the agent keeps writing. The view holds still; the pill jumps to the newest text.\u003c/div>\n  \u003cdiv class=\"scrollbox\" id=\"scrollbox\">\n   \u003cdiv class=\"prose\">\n    \u003ch2>What changed\u003c/h2>\n    \u003cul class=\"tasks\">\u003cli class=\"done\">\u003cspan class=\"cb on\">&#10003;\u003c/span>\u003cspan class=\"t\">Merge partial items on reload\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"cb\">\u003c/span>\u003cspan class=\"t\">Backfill old sessions\u003c/span>\u003c/li>\u003c/ul>\n    \u003cdiv class=\"alert a-note\">\u003cb>&#9432; Note\u003c/b>Your reading position is held here even as the code block below grows.\u003c/div>\n    \u003cp style=\"height:500px;color:var(--muted)\">&#8942; earlier output &#8942;\u003c/p>\n    \u003cp id=\"latest\">Now running the reload test suite\u003cspan class=\"caret\">&#9613;\u003c/span>\u003c/p>\n   \u003c/div>\n   \u003cbutton class=\"pill\" data-jump data-pin=\"jump-pill\">&#8595; Jump to latest\u003c/button>\n  \u003c/div>\n \u003c/div>\u003c/div>\n\n \u003cdiv data-state=\"render-error\">\u003cdiv class=\"win\">\n  \u003cdiv class=\"who\">Claude Code · opus\u003c/div>\n  \u003cdiv class=\"prose\">\n   \u003cp>Here's the flow, though the diagram has a syntax error:\u003c/p>\n   \u003cdiv class=\"rerr\" data-pin=\"mermaid-error\">\u003cdiv class=\"msg\">Couldn't draw this diagram: line 2, unexpected \"--&gt;&gt;\". Showing the source.\u003c/div>\n    \u003cpre>flowchart LR\n  A[loadTurns] --&gt;&gt; B[mergeProse]\u003c/pre>\u003c/div>\n   \u003cp>And the cost formula:\u003c/p>\n   \u003cdiv class=\"rerr\" data-pin=\"math-error\">\u003cdiv class=\"msg\">Couldn't typeset: undefined control sequence \\sume\u003c/div>\u003cpre>T = \\sume_{i=1}^n c_i\u003c/pre>\u003c/div>\n   \u003cp>An unknown fence language still gets the header and copy, just without colour:\u003c/p>\n   \u003cdiv class=\"code\">\u003cdiv class=\"hd\">\u003cspan>zig-ish\u003c/span>\u003cbutton data-copy>&#10697; Copy\u003c/button>\u003c/div>\u003cpre>\u003cspan class=\"l\">pub fn merge(prev: []Item) !void {}\u003c/span>\u003c/pre>\u003c/div>\n  \u003c/div>\n \u003c/div>\u003c/div>\n\n \u003cdiv data-state=\"light\">\u003cdiv class=\"win qk light\" id=\"lightwrap\" style=\"min-height:auto;border-radius:10px\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ Agent-drawn view ============ -->\n\u003csection data-screen=\"view-card\">\n \u003cdiv data-state=\"default\">\u003cdiv class=\"win\">\n  \u003cdiv class=\"note-strip\">A quirky.view card the agent drew. Its markdown node uses the same renderer and strict rules as chat.\u003c/div>\n  \u003cdiv class=\"viewcard\" data-pin=\"view-card\">\n   \u003cdiv class=\"vh\">\u003cspan>Release checklist · drawn by Codex\u003c/span>\u003cspan>view\u003c/span>\u003c/div>\n   \u003cdiv class=\"vb prose\">\n    \u003ch2>v2026.11.17 release\u003c/h2>\n    \u003cdiv class=\"alert a-imp\" data-pin=\"view-alert\">\u003cb>&#10070; Important\u003c/b>Signing is still manual until the m7 cert lands.\u003c/div>\n    \u003cul class=\"tasks\">\u003cli class=\"done\">\u003cspan class=\"cb on\">&#10003;\u003c/span>\u003cspan class=\"t\">Changelog written\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"cb\">\u003c/span>\u003cspan class=\"t\">Notarize the .app\u003c/span>\u003c/li>\u003c/ul>\n    \u003cdiv class=\"code\">\u003cdiv class=\"hd\">\u003cspan>bash\u003c/span>\u003cbutton data-copy>&#10697; Copy\u003c/button>\u003c/div>\u003cpre>\u003cspan class=\"l\">bun run release \u003cspan class=\"s\">--channel\u003c/span> stable\u003c/span>\u003c/pre>\u003c/div>\n    \u003cp data-pin=\"view-html-escaped\">Raw HTML from the agent shows as text: \u003ccode class=\"inl\">&lt;img src=\"https://x.io/p.gif\"&gt;\u003c/code>\u003c/p>\n   \u003c/div>\n  \u003c/div>\n \u003c/div>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ Editor preview ============ -->\n\u003csection data-screen=\"editor-preview\">\n \u003cdiv data-state=\"default\">\u003cdiv class=\"win\" style=\"max-width:980px\">\n  \u003cdiv class=\"note-strip\">The editor's markdown preview for a file you opened. Same look; your own file's HTML is allowed after cleaning.\u003c/div>\n  \u003cdiv class=\"editor\">\n   \u003cdiv class=\"src\" data-pin=\"editor-source\">&lt;p align=\"center\"&gt;&lt;img src=\"docs/logo.svg\" width=\"80\"&gt;&lt;/p&gt;\n\n# quirky\n\n&gt; [!NOTE]\n&gt; Requires macOS 15.\n\n```ts\nimport { start } from './app'\n```\n\n$$E = mc^2$$\u003c/div>\n   \u003cdiv class=\"out prose\" data-pin=\"editor-output\">\n    \u003cp style=\"text-align:center\" data-pin=\"editor-raw-html\">\u003csvg width=\"80\" height=\"40\" viewBox=\"0 0 80 40\">\u003crect width=\"80\" height=\"40\" rx=\"8\" fill=\"var(--accent)\"/>\u003ctext x=\"40\" y=\"25\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"13\" font-family=\"system-ui\">quirky\u003c/text>\u003c/svg>\u003c/p>\n    \u003ch1>quirky\u003c/h1>\n    \u003cdiv class=\"alert a-note\">\u003cb>&#9432; Note\u003c/b>Requires macOS 15.\u003c/div>\n    \u003cdiv class=\"code\">\u003cdiv class=\"hd\">\u003cspan>ts\u003c/span>\u003cbutton data-copy>&#10697; Copy\u003c/button>\u003c/div>\u003cpre>\u003cspan class=\"l\">\u003cspan class=\"k\">import\u003c/span> { start } \u003cspan class=\"k\">from\u003c/span> \u003cspan class=\"s\">'./app'\u003c/span>\u003c/span>\u003c/pre>\u003c/div>\n    \u003cdiv class=\"math-b\">E = mc\u003csup>2\u003c/sup>\u003c/div>\n   \u003c/div>\n  \u003c/div>\n \u003c/div>\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"dlg-back\" id=\"dlg\">\u003cdiv class=\"dlg\" data-pin=\"link-confirm\">\u003ch3>Open link?\u003c/h3>\u003cdiv class=\"url\" id=\"dlg-url\">\u003c/div>\u003cdiv class=\"btns\">\u003cbutton id=\"dlg-no\">Cancel\u003c/button>\u003cbutton class=\"primary\" id=\"dlg-yes\">Open in browser\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003c/div>\n\u003cscript>\n(function(){\n  const lw=document.getElementById('lightwrap');\n  lw.innerHTML=document.getElementById('showcase').innerHTML;\n  lw.querySelectorAll('[data-pin]').forEach(e=>e.setAttribute('data-pin','light-'+e.getAttribute('data-pin')));\n  function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',1800)}\n  function route(){\n    const id=(location.hash.replace(/^#\\//,'')||'transcript').split('/')[0];\n    const screens=[...document.querySelectorAll('[data-screen]')];\n    const known=screens.some(s=>s.dataset.screen===id);\n    screens.forEach(s=>s.classList.toggle('active',s.dataset.screen===(known?id:'transcript')));\n    document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===(known?id:'transcript')));\n    if(!known) toast('Not in this mock');\n  }\n  addEventListener('hashchange',route);route();\n  document.addEventListener('click',e=>{\n    const t=e.target.closest('[data-copy],[data-showall],[data-src],[data-jump],a[data-href],.chip');\n    if(!t) return;\n    if(t.matches('[data-copy]')){const o=t.innerHTML;t.textContent='✓ Copied';setTimeout(()=>t.innerHTML=o,1200)}\n    else if(t.matches('[data-showall]')){const c=t.closest('.collapsible');const closed=c.classList.toggle('closed');t.textContent=closed?'Show all 23 lines':'Show less'}\n    else if(t.matches('[data-src]')){const f=t.closest('.fig');const on=f.classList.toggle('showsrc');t.textContent=on?'Diagram':'Source'}\n    else if(t.matches('[data-jump]')){const b=document.getElementById('scrollbox');b.scrollTo({top:b.scrollHeight,behavior:'smooth'})}\n    else if(t.matches('a[data-href]')){e.preventDefault();document.getElementById('dlg-url').textContent=t.dataset.href;document.getElementById('dlg').style.display='grid'}\n    else if(t.matches('.chip.remote')){toast('Remote images never load; this opens the URL after the link prompt')}\n    else if(t.matches('.chip')){toast('Not in this mock: opens chat/turns.ts at line 119 in the editor')}\n  });\n  document.getElementById('dlg-no').onclick=()=>document.getElementById('dlg').style.display='none';\n  document.getElementById('dlg-yes').onclick=()=>{document.getElementById('dlg').style.display='none';toast('Not in this mock: opens in your browser')};\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}</script>
<script>/**
 * Pure logic for the mock review harness. Loaded two ways: inlined as a classic script in
 * mock-harness.html (exposes `QuirkMockCore`) and `require`d by app/scripts/check-harness.ts.
 * No DOM access, no network, so every rule here is testable from Node.
 */
(function (root) {
  'use strict'

  var PIN_ID = /^mock:v([1-9][0-9]{0,3})\/([a-z0-9-]{1,40})\/([a-z0-9-]{1,40})\/([a-z0-9][a-z0-9._-]{0,79})\/x([0-9]{1,3})-y([0-9]{1,3})$/

  function clampPct(n) {
    var v = Math.round(Number(n))
    if (!isFinite(v)) return 0
    return Math.max(0, Math.min(100, v))
  }

  /** Parses a pin block id into its parts, or returns null for anything that is not exactly a pin id. */
  function parsePinId(id) {
    if (typeof id !== 'string') return null
    var m = PIN_ID.exec(id)
    if (!m) return null
    var x = Number(m[5])
    var y = Number(m[6])
    if (x > 100 || y > 100) return null

    try {
      blockId = Core.formatPinId({ version: boot.version, screen: S.screenId, state: state, pin: node.getAttribute('data-pin'), x: off.x, y: off.y })
    } catch (e) {
      setNotice('This element\'s pin key is not valid, so it cannot take a comment.', true)
      return
    }
    S.openThread = null
    S.note = { blockId: blockId, x: ev.clientX, y: ev.clientY, label: inventoryLabel(node.getAttribute('data-pin')) || node.getAttribute('data-pin') }
    renderOverlay()
    renderNote()
  }

  // ---- inner frame wiring ---------------------------------------------------
  function applyStates() {
    var scr = screenEl(S.screenId)
    if (!scr) return
    var cur = currentState()
    stateEls(scr).forEach(function (node) {
      var hide = node.getAttribute('data-state') !== cur
      if (node.hidden !== hide) node.hidden = hide
    })
  }
  function refreshFrame() {
    frameTick = 0
    if (!inner) return
    applyStates()
    renderOverlay()
    paintHover()
    renderRail()
  }
  function scheduleRefresh() {
    if (frameTick) return
    frameTick = requestAnimationFrame(refreshFrame)
  }
  function onInnerHash() {
    if (!inner) return
    var nextId = Core.currentScreenId(inner.win.location.hash, boot.screens)
    var moved = nextId !== S.screenId
    S.screenId = nextId
    if (Core.isKnownScreen(boot.screens, S.screenId) && !S.visited.has(S.screenId)) {
      S.visited.add(S.screenId)
      saveVisited()
    }
    if (moved) {
      S.note = null
      S.openThread = null
    }
    hoverEl = null
    renderAll()
  }
  function goToScreen(id) {
    if (!inner) return
    inner.win.location.hash = '#/' + id
    onInnerHash()
  }
  function attach() {
    var win = frame.contentWindow
    var doc = null
    try { doc = frame.contentDocument } catch (e) { doc = null }
    if (!doc || !doc.documentElement) {
      inner = null
      setNotice('The mock document could not be read, so review tools are unavailable.', true)
      return
    }
    inner = { win: win, doc: doc }
    var style = doc.createElement('style')
    style.textContent = '[hidden]{display:none !important}'
    ;(doc.head || doc.documentElement).appendChild(style)
    win.addEventListener('hashchange', onInnerHash)
    win.addEventListener('resize', scheduleRefresh)
    doc.addEventListener('scroll', scheduleRefresh, true)
    doc.addEventListener('click', onInnerClick, true)
    doc.addEventListener('mousemove', onInnerMove, true)
    doc.documentElement.addEventListener('mouseleave', clearHover)
    if (win.MutationObserver && doc.body) new win.MutationObserver(scheduleRefresh).observe(doc.body, { childList: true, subtree: true })
    onInnerHash()
  }

  // ---- rail -----------------------------------------------------------------
  function pinCountFor(list, id) {
    return list.filter(function (p) { return p.pin.screen === id }).length
  }
  function renderRail() {
    var rail = $('rail')
    var list = appMode ? pinThreads() : []
    var reviewing = canReview()
    clear(rail)
    rail.appendChild(el('h2', { text: 'Screens' }))
    var ul = el('ul')
    screens.forEach(function (s) {
      var seen = S.visited.has(s.id)
      var count = pinCountFor(list, s.id)
      var item = el('li', { class: 'screen-item' + (s.id === S.screenId ? ' current' : '') }, [
        el('button', { type: 'button', class: 'go', 'aria-current': s.id === S.screenId ? 'page' : null, onclick: function () { goToScreen(s.id) } }, [
          el('span', { class: 'dot' + (seen ? ' visited' : ''), title: seen ? 'Visited' : 'Not visited' }),
          el('span', { class: 'title', text: s.title }),
          el('span', { class: 'count', text: (seen ? 'visited' : 'not visited') + (appMode ? ', ' + count + (count === 1 ? ' pin' : ' pins') : '') }),
        ]),
      ])
      if (reviewing) {
        var box = el('input', { type: 'checkbox', 'aria-label': 'Mark ' + s.title + ' as reviewed' })
        box.checked = S.marks.has(s.id)
        box.addEventListener('change', function () { if (box.checked) S.marks.add(s.id); else S.marks.delete(s.id) })
        item.appendChild(el('label', { class: 'mark', title: 'Mark this screen as reviewed' }, [box, 'ok']))
      }
      ul.appendChild(item)
    })
    rail.appendChild(ul)

    var cur = screenById(S.screenId)
    if (!cur && S.screenId) {
      rail.appendChild(el('p', { class: 'note' }, [el('span', { class: 'chip warn', text: 'Screen "' + S.screenId + '" is not in the inventory' })]))
    }
    if (cur && cur.skipped_states && cur.skipped_states.length) {
      rail.appendChild(el('h2', { text: 'Skipped states here' }))
      rail.appendChild(el('ul', { class: 'skipped' }, cur.skipped_states.map(function (k) { return el('li', { text: k.state + ': ' + k.reason }) })))
    }
    var gapsHere = gaps.filter(function (g) { return g.screen === S.screenId })
    if (gapsHere.length) {
      rail.appendChild(el('h2', { text: 'Gaps on this screen' }))
      rail.appendChild(el('ul', { class: 'skipped' }, gapsHere.map(function (g) { return el('li', { text: g.label + ': no matching component' }) })))
    }

    if (appMode && list.length) {
      var orphaned = list.filter(function (p) { return p.placement === 'orphaned' })
      var placed = list.filter(function (p) { return p.placement !== 'orphaned' })
      if (placed.length) {
        rail.appendChild(el('h2', { text: 'Pins' }))
        placed.forEach(function (p) { rail.appendChild(pinRow(p)) })
      }
      if (orphaned.length) {
        rail.appendChild(el('h2', { text: 'Orphaned pins' }))
        orphaned.forEach(function (p) { rail.appendChild(pinRow(p)) })
      }
    }
  }
  function pinRow(p) {
    var open = S.openThread === p.thread.id
    var first = p.thread.messages[0]
    var badges = []
    if (p.thread.resolution) badges.push(el('span', { class: 'badge ok', text: 'resolved' }))
    if (p.placement === 'reanchored') badges.push(el('span', { class: 'badge', text: 'from v' + p.pin.version }))
    if (p.placement === 'orphaned') badges.push(el('span', { class: 'badge warn', text: 'element removed in v' + boot.version }))
    var screen = screenById(p.pin.screen)
    var head = el('button', { type: 'button', class: 'head', 'aria-expanded': open ? 'true' : 'false', onclick: function () { selectThread(p.thread.id, true) } }, [
      el('strong', { text: 'Pin ' + p.n }),
      ' ',
      el('span', { class: 'meta', text: (screen ? screen.title : p.pin.screen) + ' / ' + p.pin.state + ' / ' + p.pin.pin }),
      ...badges,
      el('div', { text: first ? String(first.text).slice(0, 90) : '' }),
    ])
    var row = el('div', { class: 'pin-row' + (open ? ' selected' : '') }, [head])
    var reply = p.thread.resolution ? Core.lastAgentMessage(p.thread) : null
    if (open) row.appendChild(threadBody(p))
    else if (reply) row.appendChild(el('div', { class: 'thread' }, [messageNode(reply, true)]))
    return row
  }

  // ---- toolbar, banner, verdict bar ----------------------------------------
  function setNotice(text, isError) {
    S.notice = text
    S.noticeError = !!isError
    clearTimeout(noticeTimer)
    renderStatus()
    if (text) noticeTimer = setTimeout(function () { S.notice = ''; renderStatus() }, 6000)
  }
  function renderStatus() {
    var node = $('status')
    var text = S.paused ? 'Lost contact with the companion, retrying' : S.notice
    node.textContent = text
    node.className = 'status' + (S.paused || S.noticeError ? ' error' : '')
  }
  function pressed(id, on) { $(id).setAttribute('aria-pressed', on ? 'true' : 'false') }

  function renderToolbar() {
    $('version-chip').textContent = 'Mock v' + boot.version + (!appMode || boot.version === latestVersion() ? '' : ' (not latest)')
    var wrap = $('version-wrap')
    var picker = $('version-picker')
    if (appMode) {
      wrap.hidden = false
      clear(picker)
      var latest = latestVersion()
      versionList().forEach(function (v) {
        var o = el('option', { value: String(v), text: 'v' + v + (v === latest ? ' (latest)' : '') })
        if (v === boot.version) o.selected = true
        picker.appendChild(o)
      })
    }
    var reviewing = canReview()
    if (!reviewing && S.mode === 'comment') { S.mode = 'interact'; clearHover() }
    pressed('mode-interact', S.mode === 'interact')
    pressed('mode-comment', S.mode === 'comment')
    var cm = $('mode-comment')
    cm.hidden = !appMode
    cm.disabled = !reviewing
    cm.title = reviewing ? 'Click an element to pin a comment' : (readOnlyVersion() ? 'Only the latest version takes comments' : 'Comments are open while a review is waiting on you')
    pressed('vp-desktop', S.viewport === 'desktop')
    pressed('vp-mobile', S.viewport === 'mobile')
    frameBox.className = 'frame-box' + (S.viewport === 'mobile' ? ' mobile' : '')
    var sw = $('state-switch')
    clear(sw)
    var s = screenById(S.screenId)
    if (s && s.states && s.states.length > 1) {
      sw.hidden = false
      s.states.forEach(function (st) {
        sw.appendChild(el('button', { type: 'button', 'aria-pressed': currentState() === st ? 'true' : 'false', onclick: function () { S.states[s.id] = st; S.note = null; renderAll() }, text: st }))
      })
    } else sw.hidden = true
    renderStatus()
  }

  function renderBanner() {
    var b = $('banner')
    clear(b)
    if (!appMode) {
      b.hidden = false
      b.appendChild(el('span', { text: 'Mock v' + boot.version + ' · not the product' }))
    } else if (staleVersion()) {
      b.hidden = false
      b.appendChild(el('span', { role: 'alert', text: 'This version was updated \u2014 reload to review it' }))
      b.appendChild(el('button', { type: 'button', text: 'Reload', onclick: function () { window.location.reload() } }))
    } else if (readOnlyVersion()) {
      b.hidden = false
      var latest = latestVersion()
      b.appendChild(el('span', { text: 'v' + boot.version + ' is read-only. New comments go on v' + latest + '.' }))
      b.appendChild(el('button', { type: 'button', text: 'Go to v' + latest, onclick: function () { goToVersion(latest) } }))
    } else b.hidden = true
  }
  function goToVersion(v) {
    window.location.href = '/_quirk/mock/' + encodeURIComponent(String(v)) + '?t=' + encodeURIComponent(boot.token)
  }

  var verdictSig = ''
  function renderVerdict() {
    var bar = $('verdict')
    if (!appMode) { bar.hidden = true; return }
    var reviewing = canReview()
    var unvisited = Core.unvisitedScreens(boot.screens, S.visited)
    var sig = JSON.stringify([reviewing, S.panel, S.submitting, S.verdictError, unvisited])
    if (sig === verdictSig) return
    verdictSig = sig
    var typing = document.activeElement && bar.contains(document.activeElement) && document.activeElement.tagName === 'TEXTAREA'
      ? { start: document.activeElement.selectionStart, end: document.activeElement.selectionEnd }
      : null
    clear(bar)
    if (!reviewing) {
      bar.hidden = true
      return
    }
    bar.hidden = false
    bar.appendChild(el('strong', { text: 'Your verdict' }))
    var busy = S.submitting
    bar.appendChild(el('button', { type: 'button', class: 'primary', disabled: busy, text: 'Looks right', onclick: onLooksRight }))
    bar.appendChild(el('button', { type: 'button', disabled: busy, text: 'Needs changes', onclick: function () { S.panel = 'changes'; S.verdictError = ''; renderVerdict() } }))
    bar.appendChild(el('span', { class: 'spacer' }))
    bar.appendChild(el('button', { type: 'button', disabled: busy, text: 'Skip review', onclick: function () { submitVerdict('skip', null) } }))
    if (S.verdictError) bar.appendChild(el('span', { class: 'err', role: 'alert', text: S.verdictError }))
    if (S.panel === 'confirm') {
      var names = unvisited.map(function (id) { var s = screenById(id); return s ? s.title : id })
      bar.appendChild(el('div', { class: 'panel' }, [
        el('div', { text: 'You have not opened ' + names.join(', ') + '. Sign off anyway?' }),
        el('div', { class: 'row' }, [
          el('button', { type: 'button', class: 'primary', disabled: busy, text: 'Confirm: looks right', onclick: function () { submitVerdict('looks-right', null) } }),
          el('button', { type: 'button', disabled: busy, text: 'Keep reviewing', onclick: function () { S.panel = null; renderVerdict() } }),
        ]),
      ]))
    }
    if (S.panel === 'changes') {
      var area = el('textarea', { 'aria-label': 'Overall comment (optional)', placeholder: 'Overall comment (optional)' })
      area.value = S.changesText
      area.addEventListener('input', function () { S.changesText = area.value })
      if (typing) {
        queueMicrotask(function () {
          area.focus()
          area.setSelectionRange(typing.start, typing.end)
        })
      }
      bar.appendChild(el('div', { class: 'panel' }, [
        area,
        el('div', { class: 'row' }, [
          el('button', { type: 'button', class: 'primary', disabled: busy, text: 'Send: needs changes', onclick: function () { submitVerdict('needs-changes', S.changesText.trim()) } }),
          el('button', { type: 'button', disabled: busy, text: 'Cancel', onclick: function () { S.panel = null; renderVerdict() } }),
        ]),
      ]))
    }
  }
  function onLooksRight() {
    S.verdictError = ''
    if (Core.unvisitedScreens(boot.screens, S.visited).length) { S.panel = 'confirm'; renderVerdict() } else submitVerdict('looks-right', null)
  }
  function submitVerdict(verdict, comment) {
    if (S.submitting || !canReview()) return
    var ids = screens.map(function (s) { return s.id })
    var payload = {
      verdict: verdict,
      visited: ids.filter(function (id) { return S.visited.has(id) }),
      marks: ids.filter(function (id) { return S.marks.has(id) }),
    }
    if (comment) payload.comment = comment
    S.submitting = true
    S.verdictError = ''
    renderVerdict()
    var step = S.snap.step
    postEvent('submit', payload, { nonce: step.nonce, step: step.id }).then(function (result) {
      S.submitting = false
      if (result === 'ok') {
        S.panel = null
        setNotice('Verdict sent.', false)
      } else if (result === 'superseded') {
        S.panel = null
        S.verdictError = 'That review was replaced by a newer one. Refreshing.'
      } else S.verdictError = 'Could not send the verdict. Try again.'
      renderVerdict()
      pollNow()
    })
  }

  function renderAll() {
    renderToolbar()
    renderBanner()
    applyStates()
    renderRail()
    renderOverlay()
    renderNote()
    paintHover()
    renderVerdict()
  }

  // ---- companion transport (same-origin app endpoints only) ------------------
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID()
    return 'c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2)
  }
  /** Posts one event, retrying network errors with the same client_id so the server can dedupe. */
  function postEvent(type, payload, scope) {
    var body = { client_id: uuid(), type: type, payload: payload }
    if (scope.nonce) body.nonce = scope.nonce
    if (scope.step) body.step = scope.step
    var text = JSON.stringify(body)
    function attempt(n) {
      return fetch('/_quirk/app/event', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Quirk-Token': boot.token },
        body: text,
      }).then(function (r) {
        if (r.status === 409) return 'superseded'
        return r.ok ? 'ok' : 'error'
      }, function () {
        if (n >= 3) return 'error'
        return new Promise(function (resolve) { setTimeout(resolve, 200 * (n + 1)) }).then(function () { return attempt(n + 1) })
      })
    }
    return attempt(0)
  }

  var rev = ''
  var failures = 0
  var inflight = false
  var pollTimer = null
  function pollDelay() {
    return failures < 3 ? 1000 : Math.min(5000, 1000 * Math.pow(2, failures - 2))
  }
  function poll() {
    if (inflight) return
    inflight = true
    fetch('/_quirk/app/snapshot?rev=' + encodeURIComponent(rev), { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 200) {
          return r.json().then(function (snap) {
            rev = String(snap.rev)
            S.snap = snap
            renderAll()
          })
        }
        if (r.status !== 204) throw new Error('snapshot ' + r.status)
        return null
      })
      .then(function () {
        var recovered = failures > 0
        failures = 0
        if (S.paused || recovered) { S.paused = false; renderStatus() }
      })
      .catch(function () {
        failures += 1
        if (failures >= 3 && !S.paused) { S.paused = true; renderStatus() }
      })
      .then(function () {
        inflight = false
        clearTimeout(pollTimer)
        pollTimer = setTimeout(poll, pollDelay())
      })
  }
  function pollNow() {
    if (!appMode) return
    clearTimeout(pollTimer)
    poll()
  }

  // ---- controls ------------------------------------------------------------
  $('mode-interact').addEventListener('click', function () { S.mode = 'interact'; clearHover(); renderToolbar() })
  $('mode-comment').addEventListener('click', function () { if (canReview()) { S.mode = 'comment'; renderToolbar() } })
  $('vp-desktop').addEventListener('click', function () { S.viewport = 'desktop'; renderToolbar(); scheduleRefresh() })
  $('vp-mobile').addEventListener('click', function () { S.viewport = 'mobile'; renderToolbar(); scheduleRefresh() })
  $('show-changes').addEventListener('change', function (ev) {
    S.showChanges = ev.target.checked
    if (S.showChanges && !changed.size) setNotice('Nothing was recorded as changed in this version.', false)
    renderOverlay()
  })
  $('version-picker').addEventListener('change', function (ev) {
    var v = Number(ev.target.value)
    if (v !== boot.version) goToVersion(v)
  })
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && (S.note || S.openThread)) { S.note = null; S.openThread = null; renderNote(); renderOverlay(); renderRail() }
  })
  window.addEventListener('resize', scheduleRefresh)
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') pollNow() })

  frame.addEventListener('load', attach)
  frame.srcdoc = Core.withBase(String(boot.mock_html || ''))
  renderAll()
  if (appMode) poll()
})()
</script>
</body>
</html>
